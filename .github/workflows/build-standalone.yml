name: MESOB Frontend Standalone Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesob-frontend-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build standalone application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          test -f .next/standalone/server.js
          test -d .next/static
          test -s package-lock.json

          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp package-lock.json release/package-lock.json

          if [ -d public ]; then
            cp -a public release/public
          fi

          test -f release/server.js
          test -s release/.next/BUILD_ID
          test -f release/node_modules/next/package.json
          test -s release/package-lock.json
          test -d release/.next/static

          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "commit=${GITHUB_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > release/RELEASE_INFO.txt

          cd release
          zip -qr "../mesob-frontend-${GITHUB_SHA}.zip" .

          cd ..
          sha256sum "mesob-frontend-${GITHUB_SHA}.zip" \
            > "mesob-frontend-${GITHUB_SHA}.zip.sha256"

          unzip -tq "mesob-frontend-${GITHUB_SHA}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesob-frontend-${{ github.sha }}
          path: |
            mesob-frontend-${{ github.sha }}.zip
            mesob-frontend-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
