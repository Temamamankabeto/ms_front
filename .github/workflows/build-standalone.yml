name: MESOB Frontend Standalone Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesob-frontend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build standalone application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          test -f .next/standalone/server.js
          test -d .next/static
          test -s package-lock.json

          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp package-lock.json release/package-lock.json

          if [ -d public ]; then
            cp -a public release/public
          fi

          test -f release/server.js
          test -s release/.next/BUILD_ID
          test -f release/node_modules/next/package.json
          test -s release/package-lock.json
          test -d release/.next/static

          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "commit=${GITHUB_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > release/RELEASE_INFO.txt

          cd release
          zip -qr "../mesob-frontend-${GITHUB_SHA}.zip" .

          cd ..
          sha256sum "mesob-frontend-${GITHUB_SHA}.zip" \
            > "mesob-frontend-${GITHUB_SHA}.zip.sha256"

          unzip -tq "mesob-frontend-${GITHUB_SHA}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesob-frontend-${{ github.sha }}
          path: |
            mesob-frontend-${{ github.sha }}.zip
            mesob-frontend-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  deploy:
    name: Deploy verified release to Ubuntu
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (vars.MESOB_AUTO_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Confirm this is the latest main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'A newer main commit exists; skipping stale deployment.' >&2
            exit 1
          }

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mesob-frontend-${{ github.sha }}
          path: deployment-artifact

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd deployment-artifact
          sha256sum -c "mesob-frontend-${GITHUB_SHA}.zip.sha256"
          unzip -tq "mesob-frontend-${GITHUB_SHA}.zip"

      - name: Configure pinned deployment SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MESOB_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MESOB_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.MESOB_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing MESOB_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing MESOB_DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing MESOB_DEPLOY_SSH_KEY}"
          if [ "$DEPLOY_USER" != 'mesobdeploy' ]; then
            echo 'DEPLOY_CHECK_FAILED: username does not match mesobdeploy' >&2
            exit 1
          fi
          echo 'DEPLOY_CHECK_PASSED: username'

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1; then
            echo 'DEPLOY_CHECK_FAILED: invalid SSH private key' >&2
            exit 1
          fi
          echo 'DEPLOY_CHECK_PASSED: private key'

          if ! ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null; then
            echo 'DEPLOY_CHECK_FAILED: SSH host key retrieval' >&2
            exit 1
          fi

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo 'DEPLOY_CHECK_FAILED: empty SSH known_hosts' >&2
            exit 1
          fi
          echo 'DEPLOY_CHECK_PASSED: host key retrieved'
          FINGERPRINT=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$FINGERPRINT" = 'SHA256:JORh7HsxyasAKw29nUoJwE5RYf7TIiJ2VKMZmlLHIkw' || {
            echo 'SSH server host key mismatch' >&2
            exit 1
          }
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MESOB_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MESOB_DEPLOY_USER }}
        run: |
          set -euo pipefail
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSH_OPTS=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" "$REMOTE" 'mkdir -p /var/www/mesob-frontend-releases/shared/incoming'
          scp "${SSH_OPTS[@]}" \
            "deployment-artifact/mesob-frontend-${GITHUB_SHA}.zip" \
            "deployment-artifact/mesob-frontend-${GITHUB_SHA}.zip.sha256" \
            "$REMOTE:/var/www/mesob-frontend-releases/shared/incoming/"
          ssh -T "${SSH_OPTS[@]}" "$REMOTE" "bash -s -- '$GITHUB_SHA'" \
            < scripts/deploy/mesob-frontend-deploy.sh
