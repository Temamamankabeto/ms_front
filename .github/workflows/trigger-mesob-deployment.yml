name: Trigger MESOB Frontend Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify Central Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch frontend deployment
        env:
          GH_TOKEN: ${{ secrets.MESOB_DEPLOY_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing MESOB_DEPLOY_DISPATCH_TOKEN" >&2
            exit 1
          fi

          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

          gh api \
            --method POST \
            repos/Temamamankabeto/mesob-deployment/dispatches \
            -f event_type=mesob-frontend-push \
            -f client_payload[sha]="$SOURCE_SHA"

          echo "Deployment requested for $SOURCE_SHA"
